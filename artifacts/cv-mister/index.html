<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CV-Mister — Professional Resume Builder SaaS. Create stunning resumes with AI, 10+ templates, bilingual support, and pixel-perfect A4 PDF export." />
    <meta name="keywords" content="resume builder, CV maker, professional resume, PDF export, AI resume, ATS resume, سيرة ذاتية" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CV-Mister" />
    <meta name="application-name" content="CV-Mister" />
    <meta name="msapplication-TileColor" content="#6366f1" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CV-Mister | Professional Resume Builder" />
    <meta property="og:description" content="Build professional resumes with AI — Full Arabic & English support, 10+ templates, PDF export." />
    <meta property="og:image" content="/opengraph.jpg" />

    <title>CV-Mister | Professional Resume Builder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration
         NOTE: Service Workers cannot run inside cross-origin iframes (Replit preview).
         This will silently be skipped in the dev preview but will work correctly
         on the deployed production URL. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          var isInIframe = false;
          try { isInIframe = window.self !== window.top; } catch (e) { isInIframe = true; }
          if (isInIframe) return;

          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then(function (reg) {
              console.log('[SW] Registered, scope:', reg.scope);
            })
            .catch(function (err) {
              console.warn('[SW] Registration skipped:', err.message);
            });
        });
      }
    </script>
  </body>
</html>
