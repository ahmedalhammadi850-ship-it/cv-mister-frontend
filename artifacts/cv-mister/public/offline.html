<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV-Mister — غير متصل</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #334155;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
    }
    .emoji { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; color: #1e293b; }
    p { color: #64748b; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📶</div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>يبدو أن اتصالك بالإنترنت منقطع. تحقق من اتصالك وأعد المحاولة.</p>
    <button onclick="window.location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
